services:
  database-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: walleting_test
      POSTGRES_USER: walleting
      POSTGRES_PASSWORD: walleting
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "walleting_test", "-U", "walleting"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
